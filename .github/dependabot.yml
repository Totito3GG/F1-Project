version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: "/docker/airflow"
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: "/docker/mlflow"
    schedule: { interval: monthly }
