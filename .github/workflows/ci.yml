# CI RaceFlow : à chaque push / pull request.
#   lint -> test -> dags -> pipeline-smoke (Bronze->Silver->Gold->train->predict sur données synthétiques) -> docker
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip }
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: pytest tests/ -q

  dags:
    # Vérifie que les 5 DAGs Airflow se chargent et s'enchaînent (tests/test_dags.py), avec le vrai Airflow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip }
      - name: Installer Airflow (contraintes officielles)
        run: |
          pip install "apache-airflow==2.10.5" pytest \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.11.txt"
      - name: Tester les DAGs
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        run: pytest tests/test_dags.py -q -p no:cacheprovider

  pipeline-smoke:
    # Test de bout en bout sans Kafka ni API : de FAUSSES données (aucune valeur sportive) traversent tout le pipeline.
    runs-on: ubuntu-latest
    needs: [lint, test]
    env:
      RACEFLOW_DATA: ${{ github.workspace }}/ci_data
      MLFLOW_TRACKING_URI: sqlite:///${{ github.workspace }}/ci_mlflow.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt "pyspark==3.5.1"
      - name: Générer un Bronze synthétique
        run: python scripts/make_synthetic_data.py --out "$RACEFLOW_DATA" --first-season 2015 --last-season 2020
      - name: Bronze -> Silver
        run: |
          python streaming/bronze_to_silver.py
          python streaming/qualifying_to_silver.py
      - name: Silver -> Gold
        run: python streaming/silver_to_gold.py
      - name: Contrôle qualité Gold
        run: python ml/check_gold.py --gold "$RACEFLOW_DATA/gold/features"
      - name: Entraînement (MLflow)
        run: python ml/train.py --gold "$RACEFLOW_DATA/gold/features" --test-from 2019 --wf-from 2017
      - name: Prédiction
        run: python ml/predict.py --gold "$RACEFLOW_DATA/gold/features"

  docker:
    # Les images (Airflow, MLflow, dashboard) se construisent et le docker-compose est valide.
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Valider docker-compose.yml
        run: docker compose config -q
      - name: Construire les images
        run: docker compose build airflow mlflow dashboard exporter
