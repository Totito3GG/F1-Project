services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: raceflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  spark:
    image: apache/spark:3.5.1-python3
    container_name: spark
    user: root
    command: tail -f /dev/null
    volumes:
      - ./streaming:/opt/app/streaming
      - ./data:/opt/app/data
    depends_on:
      - kafka

  # ---------------------------------------------------------------- Étape 8 : MLflow + Airflow
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    container_name: mlflow
    ports:
      - "${MLFLOW_PORT:-5001}:5000"      # 5001 côté PC : le port 5000 reste libre pour « mlflow ui » en local
    # --allowed-hosts : sans lui MLflow 3.x rejette le nom « mlflow » utilisé par Airflow (erreur 403 Invalid Host header)
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts mlflow:*,mlflow,localhost:*,localhost,127.0.0.1:*,127.0.0.1
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  airflow:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: airflow
    ports:
      - "${AIRFLOW_PORT:-8081}:8080"     # 8081 : le port 8080 est pris par Kafka UI
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"   # les DAGs s'enchaînent sans les activer à la main
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/db/airflow.db
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-raceflow-dev-secret-change-me}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      # utilisés par les scripts du projet lancés depuis les DAGs
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_BOOTSTRAP_INTERNAL: kafka:29092
      JOLPICA_URL: ${JOLPICA_URL:-https://api.jolpi.ca/ergast/f1}
      RACEFLOW_DATA: /opt/raceflow/data
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./ingestion:/opt/raceflow/ingestion
      - ./streaming:/opt/raceflow/streaming
      - ./ml:/opt/raceflow/ml
      - ./data:/opt/raceflow/data
      - airflow_db:/opt/airflow/db
      - airflow_logs:/opt/airflow/logs
    depends_on:
      kafka:
        condition: service_started
      mlflow:
        condition: service_healthy

  # ---------------------------------------------------------------- Étape 9 : dashboard Streamlit
  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
    container_name: dashboard
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    environment:
      RACEFLOW_DATA: /app/data
      MLFLOW_URL: http://mlflow:5000                               # adresse de MLflow vue depuis le conteneur
      MLFLOW_UI_URL: http://localhost:${MLFLOW_PORT:-5001}          # lien « ouvrir dans MLflow » pour le navigateur
    volumes:
      - ./dashboard:/app/dashboard
      - ./data:/app/data:ro                                         # lecture seule : le dashboard ne modifie rien
    depends_on:
      mlflow:
        condition: service_healthy

volumes:
  mlflow_data:
  airflow_db:
  airflow_logs:
