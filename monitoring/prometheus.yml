# Prometheus (étape 11) : vient chercher les métriques de l'exporter RaceFlow toutes les 30 secondes
# et garde leur historique (15 jours par défaut).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: raceflow
    static_configs:
      - targets: ["exporter:8000"]
